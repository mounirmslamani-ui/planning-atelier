<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ouverture du dossier</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      main {
        max-width: 520px;
        padding: 24px;
        text-align: center;
      }
      a {
        color: #2563eb;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Ouverture du dossier Google Drive…</p>
      <p><a id="fallback" href="#" rel="noreferrer">Cliquer ici si la redirection ne démarre pas</a></p>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      const target = params.get('to') || '';
      const fallback = document.getElementById('fallback');

      function isAllowedDriveUrl(value) {
        try {
          const url = new URL(value);
          return url.protocol === 'https:' && ['drive.google.com', 'docs.google.com'].includes(url.hostname);
        } catch (_) {
          return false;
        }
      }

      if (isAllowedDriveUrl(target)) {
        fallback.href = target;
        window.location.replace(target);
      } else {
        document.querySelector('p').textContent = 'Lien Google Drive invalide.';
        fallback.removeAttribute('href');
      }
    </script>
  </body>
</html>
